[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "email-attachment-downloader"
version = "1.1.0"
description = "Download targeted email attachments over IMAP or the Gmail API (HTTPS)."
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0"]

[project.scripts]
email-attachment-downloader = "email_attachment_downloader.cli:main"

[tool.setuptools.packages.find]
include = ["email_attachment_downloader*"]

